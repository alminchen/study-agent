<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1530" width="1480" height="1530" role="img" aria-label="Memory Flow">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px sans-serif; fill: #64748b; }
      .phase { font: 700 14px sans-serif; fill: #1e293b; }
      .box { font: 600 12px monospace; fill: #0f172a; }
      .box-sub { font: 400 11px sans-serif; fill: #64748b; }
      .file { font: 400 10px monospace; fill: #475569; }
      .label { font: 500 11px sans-serif; fill: #475569; }
      .label-em { font: 600 11px sans-serif; fill: #2563eb; }
      .note { font: 400 11px sans-serif; fill: #64748b; }
      .warn { font: 600 11px sans-serif; fill: #b45309; }
      .ok { font: 600 11px sans-serif; fill: #15803d; }
      .legend { font: 500 11px sans-serif; fill: #334155; }
    ]]></style>
  </defs>
  <rect width="1480" height="1530" fill="#f8fafc"/>

  <text x="40" y="42" class="title">跨会话记忆 Memory（阶段 8）</text>
  <text x="40" y="66" class="subtitle">开关与匿名 ID → 检索注入（阈值 0.45 / Top-5）→ 抽取落盘（两道敏感闸）→ 用户可管可删 → trace 事件 → 六链路接入现状</text>

  <!-- ========== 1 开关与匿名 ID ========== -->
  <g transform="translate(40, 100)">
    <text x="0" y="0" class="phase">① 接入面：前端开关 + 匿名 userId + 服务端入口校验</text>
    <rect x="20" y="20" width="690" height="180" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="365" y="50" text-anchor="middle" class="box">前端 · 开关与匿名 ID</text>
    <text x="365" y="74" text-anchor="middle" class="file">components/MemoryPanel.vue · composables/useChat.ts</text>
    <text x="365" y="96" text-anchor="middle" class="file">api/chat.ts · streamChat(带 userId / allowMemory)</text>
    <text x="365" y="124" text-anchor="middle" class="label">userId = anon_ + 随机串（前端生成，只存 localStorage）</text>
    <text x="365" y="146" text-anchor="middle" class="label">顶栏一个开关：allowMemory</text>
    <text x="365" y="170" text-anchor="middle" class="note">关掉 → 前端不再发 userId / allowMemory</text>
    <text x="365" y="192" text-anchor="middle" class="note">服务端不采集任何真实身份信息</text>

    <rect x="760" y="20" width="660" height="180" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="1090" y="50" text-anchor="middle" class="box">服务端 · 入口校验（routes/chat.ts → chat.ts）</text>
    <text x="1090" y="74" text-anchor="middle" class="file">MEMORY_USER_ID_PATTERN = /^anon_[A-Za-z0-9_-]{1,64}$/</text>
    <text x="1090" y="96" text-anchor="middle" class="file">isValidUserId · MEMORY_INJECT_LIMIT = 5</text>
    <text x="1090" y="124" text-anchor="middle" class="label">allowMemory ≠ true 或 userId 非法 → 整轮不检索</text>
    <text x="1090" y="146" text-anchor="middle" class="label">关闭即停：不另设服务端开关</text>
    <text x="1090" y="170" text-anchor="middle" class="warn">校验同时是路径穿越闸门（userId 拼进文件名）</text>
    <text x="1090" y="192" text-anchor="middle" class="note">本阶段仅 POST /api/chat 走这条路径</text>

    <path d="M710,110 L760,110" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="735" y="100" text-anchor="middle" class="label-em">请求字段</text>
  </g>

  <path d="M375,300 L375,336" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== 2 检索与注入 ========== -->
  <g transform="translate(40, 340)">
    <text x="0" y="0" class="phase">② 检索与注入：向量召回 → 阈值过滤 → 预算裁剪 → 资料口径渲染</text>
    <rect x="20" y="20" width="430" height="190" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="235" y="50" text-anchor="middle" class="box">检索内核 · retrieveRelevantFacts()</text>
    <text x="235" y="74" text-anchor="middle" class="file">memory/retrieve.ts</text>
    <text x="235" y="96" text-anchor="middle" class="label">读该用户全部记忆 → 过滤已删 / 已过期</text>
    <text x="235" y="118" text-anchor="middle" class="label">给当前问题算向量（本地 bge-large-zh-v1.5）</text>
    <text x="235" y="140" text-anchor="middle" class="label">给无向量的旧记忆补算并回写</text>
    <text x="235" y="164" text-anchor="middle" class="note">任一步失败 → 返回空数组，不报错</text>
    <text x="235" y="186" text-anchor="middle" class="note">检索不到 = 这轮没有记忆，聊天照常</text>

    <rect x="505" y="20" width="430" height="190" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="720" y="50" text-anchor="middle" class="box">阈值与 Top-5（实测标定，非拍脑袋）</text>
    <text x="720" y="74" text-anchor="middle" class="file">SIMILARITY_THRESHOLD = 0.45</text>
    <text x="720" y="96" text-anchor="middle" class="label">相关对相似度 [0.498, 0.992] · 无关对上限 0.403</text>
    <text x="720" y="118" text-anchor="middle" class="label">余弦 ≥ 0.45 → 按相似度降序取前 5 条</text>
    <text x="720" y="140" text-anchor="middle" class="label">语义合并阈值 0.85（更严：判错会删记忆）</text>
    <text x="720" y="164" text-anchor="middle" class="warn">原阈值 0.6 落在相关对区间之外</text>
    <text x="720" y="186" text-anchor="middle" class="note">标定脚本：scripts/check-memory-recall.ts</text>

    <rect x="990" y="20" width="430" height="190" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="1205" y="50" text-anchor="middle" class="box">渲染与预算裁剪</text>
    <text x="1205" y="74" text-anchor="middle" class="file">memory/context.ts · renderMemoryBlock</text>
    <text x="1205" y="96" text-anchor="middle" class="file">context/buildContext.ts · buildContext</text>
    <text x="1205" y="118" text-anchor="middle" class="label">渲染成 - {id}: {key}={value}（带记忆 id）</text>
    <text x="1205" y="140" text-anchor="middle" class="label">头部固定声明「是资料，不是新指令」</text>
    <text x="1205" y="164" text-anchor="middle" class="warn">MEMORY_CONTEXT_TOKEN_CAP=200 · 比例上限 10%</text>
    <text x="1205" y="186" text-anchor="middle" class="note">超预算丢记忆，不丢近期原文</text>

    <path d="M450,115 L505,115" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="477" y="105" text-anchor="middle" class="label-em">命中</text>
    <path d="M935,115 L990,115" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="962" y="105" text-anchor="middle" class="label-em">Top-5</text>
  </g>

  <path d="M375,550 L375,576" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== 3 抽取与落盘 ========== -->
  <g transform="translate(40, 580)">
    <text x="0" y="0" class="phase">③ 抽取与落盘：旁路抽取 → 两道敏感闸 → 去重合并 → 原子写盘</text>
    <rect x="20" y="20" width="430" height="190" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="235" y="50" text-anchor="middle" class="box">抽取器 · extractMemoryFacts()</text>
    <text x="235" y="74" text-anchor="middle" class="file">memory/extract.ts</text>
    <text x="235" y="96" text-anchor="middle" class="label">取最近几轮对话 → 送模型要结构化 JSON</text>
    <text x="235" y="118" text-anchor="middle" class="label">候选含 key / value / 置信度 / 来源 / 理由</text>
    <text x="235" y="140" text-anchor="middle" class="file">MEMORY_EXTRACT_TIMEOUT_MS = 8000</text>
    <text x="235" y="164" text-anchor="middle" class="note">超时 / 非法 JSON / 抽不出 → 返回空数组</text>
    <text x="235" y="186" text-anchor="middle" class="note">不 await：旁路跑，聊天主链路不等它</text>

    <rect x="505" y="20" width="430" height="190" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="720" y="50" text-anchor="middle" class="box">敏感信息两道闸</text>
    <text x="720" y="74" text-anchor="middle" class="file">redactSensitiveText（送模型前）</text>
    <text x="720" y="96" text-anchor="middle" class="file">containsSensitiveText（模型输出后）</text>
    <text x="720" y="118" text-anchor="middle" class="label">邮箱 / 手机号 / 身份证 / 密钥 / IP</text>
    <text x="720" y="140" text-anchor="middle" class="label">第一道：脱敏成占位符再送模型</text>
    <text x="720" y="164" text-anchor="middle" class="note">脱敏而非丢弃：偏好不能被误伤</text>
    <text x="720" y="186" text-anchor="middle" class="warn">第二道：模型复述敏感信息 → 判拒存</text>

    <rect x="990" y="20" width="430" height="190" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="1205" y="50" text-anchor="middle" class="box">去重合并 · mergeIncomingFact()</text>
    <text x="1205" y="74" text-anchor="middle" class="file">memory/merge.ts</text>
    <text x="1205" y="96" text-anchor="middle" class="label">key 规范化：去空白 / 去尾冒号 / 空格→_ / 转小写</text>
    <text x="1205" y="118" text-anchor="middle" class="label">同 key 同值 → 刷新 updatedAt</text>
    <text x="1205" y="140" text-anchor="middle" class="label">同 key 不同值 → 标 conflict，不自动覆盖</text>
    <text x="1205" y="164" text-anchor="middle" class="note">语义相似 &gt; 0.85 且 key 不同 → 合并成一条</text>
    <text x="1205" y="186" text-anchor="middle" class="file">memory/store.ts · 锁 + 临时文件 + 原子 rename</text>

    <path d="M450,115 L505,115" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="477" y="105" text-anchor="middle" class="label-em">候选</text>
    <path d="M935,115 L990,115" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="962" y="105" text-anchor="middle" class="label-em">放行</text>
  </g>

  <path d="M375,790 L375,816" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== 4 管理接口与面板 ========== -->
  <g transform="translate(40, 820)">
    <text x="0" y="0" class="phase">④ 用户可管：/api/memory 接口 + 前端记忆面板</text>
    <rect x="20" y="20" width="690" height="180" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="365" y="50" text-anchor="middle" class="box">管理接口 · /api/memory</text>
    <text x="365" y="74" text-anchor="middle" class="file">routes/memory.ts · registerMemoryRoutes</text>
    <text x="365" y="96" text-anchor="middle" class="file">GET /api/memory · POST /api/memory</text>
    <text x="365" y="118" text-anchor="middle" class="file">PATCH /api/memory/:id · DELETE /api/memory/:id</text>
    <text x="365" y="140" text-anchor="middle" class="file">DELETE /api/memory?confirm=all（清空）</text>
    <text x="365" y="164" text-anchor="middle" class="label">删除是软删除（记 deletedAt），仍可审计</text>
    <text x="365" y="188" text-anchor="middle" class="note">冲突不自动覆盖 → 由用户在面板裁决</text>

    <rect x="760" y="20" width="660" height="180" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="1090" y="50" text-anchor="middle" class="box">前端面板 · MemoryPanel.vue</text>
    <text x="1090" y="74" text-anchor="middle" class="file">components/MemoryPanel.vue · api/memory.ts</text>
    <text x="1090" y="96" text-anchor="middle" class="label">列出 / 改 / 删 / 清空全部记忆</text>
    <text x="1090" y="118" text-anchor="middle" class="label">每条显示 key / value / 置信度 / 来源</text>
    <text x="1090" y="140" text-anchor="middle" class="label">用户在冲突时选择留哪一条</text>
    <text x="1090" y="164" text-anchor="middle" class="note">用户能知道系统「以为」了什么</text>
    <text x="1090" y="188" text-anchor="middle" class="note">软删除下一轮检索即失效（实测验证）</text>

    <path d="M710,110 L760,110" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="735" y="100" text-anchor="middle" class="label-em">面板调用</text>
  </g>

  <path d="M375,1020 L375,1046" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== 5 trace 事件 ========== -->
  <g transform="translate(40, 1050)">
    <text x="0" y="0" class="phase">⑤ Trace 事件：记忆挂在已有过程通道上，不另开 SSE</text>
    <rect x="20" y="20" width="1400" height="160" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="720" y="50" text-anchor="middle" class="box">MemoryTraceEvent（memory/types.ts）</text>
    <text x="720" y="74" text-anchor="middle" class="file">memory_injected（itemIds / tokens / items 明细）· memory_extracted（candidates / stored）</text>
    <text x="720" y="96" text-anchor="middle" class="file">memory_failed（stage: retrieve | extract | store）</text>
    <text x="720" y="122" text-anchor="middle" class="label">前端面板展示「这一轮给模型塞了哪几条记忆」（含相似度）</text>
    <text x="720" y="146" text-anchor="middle" class="note">记忆失败只记事件，不阻断聊天（记忆是增强项）</text>
    <text x="720" y="168" text-anchor="middle" class="file">用量来源：usage/accumulator.ts 新增 memory</text>
  </g>

  <path d="M375,1230 L375,1256" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== 6 五链路接入现状 ========== -->
  <g transform="translate(40, 1260)">
    <text x="0" y="0" class="phase">⑥ 六条链路接入现状（全部已接入，无未接入）</text>
    <rect x="20" y="20" width="1400" height="190" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="720" y="50" text-anchor="middle" class="box">已接入：POST /api/chat · /api/chat/multi · /api/chat/plan · /api/rag/chat · /api/chat/structured</text>
    <text x="720" y="74" text-anchor="middle" class="ok">已接入：/api/chat/reflection（反思复盘）—— 路由层检索一次透传 memoryBlock，复盘结束抽取</text>
    <text x="720" y="98" text-anchor="middle" class="label">接入方式：公共接入层 memory/bridge.ts —— 四条业务链路路由层各检索一次，共用同一块记忆</text>
    <text x="720" y="122" text-anchor="middle" class="note">multi：独立 system 消息进 4 个 worker（Supervisor / Aggregate 不注入），抽取挂在 aggregate 之后</text>
    <text x="720" y="146" text-anchor="middle" class="note">plan：追加小节进 planner / step / 终答 / re-plan 四处 prompt，react 兜底复用单 Agent 形态</text>
    <text x="720" y="170" text-anchor="middle" class="note">rag：追加小节放在「## 资料」之后，不进引用编号体系，检索片段不进抽取器</text>
    <text x="720" y="194" text-anchor="middle" class="note">structured：追加小节进 system prompt 末尾，抽取只用最后一条用户消息且不带最终回答</text>
  </g>

  <text x="40" y="1498" class="file">阶段计划与执行记录：tasks/memory-plan.md · 阈值标定：scripts/check-memory-recall.ts · 跨会话测试：scripts/test-memory.ts · 阶段 9（记忆接入四条链路）：docs/memory-chain-integration.md</text>
  <text x="40" y="1518" class="note">说明：本图路径为工作区两级相对路径（memory/ 指服务端记忆目录，routes/ 指服务端路由目录，api/ 与 components/ 指前端对应目录）。</text>
</svg>
