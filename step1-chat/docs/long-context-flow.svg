<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1930" width="1480" height="1930" role="img" aria-label="Long Context Management Flow">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px sans-serif; fill: #64748b; }
      .lane { font: 700 12px sans-serif; fill: #475569; }
      .phase { font: 700 14px sans-serif; fill: #1e293b; }
      .box { font: 600 12px monospace; fill: #0f172a; }
      .box-sub { font: 400 11px sans-serif; fill: #64748b; }
      .file { font: 400 10px monospace; fill: #94a3b8; }
      .label { font: 500 11px sans-serif; fill: #475569; }
      .label-em { font: 600 11px sans-serif; fill: #2563eb; }
      .note { font: 400 11px sans-serif; fill: #64748b; }
      .legend { font: 500 11px sans-serif; fill: #334155; }
      .warn { font: 600 11px sans-serif; fill: #b45309; }
      .ok { font: 600 11px sans-serif; fill: #047857; }
    ]]></style>
  </defs>
  <rect width="1480" height="1930" fill="#f8fafc"/>

  <text x="40" y="42" class="title">长上下文管理（进阶学习第 3 项）· 预算窗口 + 结构化摘要</text>
  <text x="40" y="66" class="subtitle">单 Agent /api/chat + 多 Agent /api/chat/multi Worker · contextMode=budget · 摘要失败一律降级为裸窗口，聊天不中断</text>

  <g transform="translate(40, 86)">
    <rect x="0" y="0" width="1400" height="46" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <rect x="16" y="14" width="18" height="18" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="42" y="28" class="legend">前端 / localStorage</text>
    <rect x="210" y="14" width="18" height="18" rx="3" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="236" y="28" class="legend">路由</text>
    <rect x="320" y="14" width="18" height="18" rx="3" fill="#dcfce7" stroke="#059669"/>
    <text x="346" y="28" class="legend">Context 内核（纯函数）</text>
    <rect x="540" y="14" width="18" height="18" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="566" y="28" class="legend">摘要模型调用</text>
    <rect x="700" y="14" width="18" height="18" rx="3" fill="#fce7f3" stroke="#db2777"/>
    <text x="726" y="28" class="legend">LLM / SSE</text>
  </g>

  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="270" height="32" rx="6" fill="#bfdbfe"/>
    <text x="135" y="21" text-anchor="middle" class="lane">FRONTEND</text>
    <rect x="290" y="0" width="330" height="32" rx="6" fill="#c7d2fe"/>
    <text x="455" y="21" text-anchor="middle" class="lane">ROUTE</text>
    <rect x="640" y="0" width="460" height="32" rx="6" fill="#a7f3d0"/>
    <text x="870" y="21" text-anchor="middle" class="lane">CONTEXT · budget / summary</text>
    <rect x="1120" y="0" width="280" height="32" rx="6" fill="#fbcfe8"/>
    <text x="1260" y="21" text-anchor="middle" class="lane">LLM · SSE</text>
  </g>

  <rect x="40" y="200" width="270" height="1500" fill="#eff6ff" opacity="0.45"/>
  <rect x="330" y="200" width="330" height="1500" fill="#eef2ff" opacity="0.45"/>
  <rect x="680" y="200" width="460" height="1500" fill="#ecfdf5" opacity="0.5"/>
  <rect x="1160" y="200" width="280" height="1500" fill="#fdf2f8" opacity="0.5"/>

  <g transform="translate(40, 220)">
    <text x="0" y="0" class="phase">1 · 请求前：摘要随请求带回（前端持久化，服务端只校验）</text>

    <rect x="10" y="24" width="250" height="110" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="135" y="50" text-anchor="middle" class="box">loadContextSummary()</text>
    <text x="135" y="70" text-anchor="middle" class="box-sub">localStorage: context-summary</text>
    <text x="135" y="88" text-anchor="middle" class="box-sub">history 仍只存 user/assistant</text>
    <text x="135" y="106" text-anchor="middle" class="box-sub">清空会话 → 摘要一起清</text>
    <text x="135" y="124" text-anchor="middle" class="file">useChat.ts</text>

    <line x1="260" y1="79" x2="298" y2="79" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="300" y="24" width="310" height="110" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="455" y="50" text-anchor="middle" class="box">POST /api/chat</text>
    <text x="455" y="70" text-anchor="middle" class="box-sub">{ messages, contextSummary }</text>
    <text x="455" y="88" text-anchor="middle" class="box-sub">parseContextSummary() 逐字段校验</text>
    <text x="455" y="106" text-anchor="middle" class="box-sub">非法 → 当作没有摘要（不报错）</text>
    <text x="455" y="124" text-anchor="middle" class="file">routes/chat.ts</text>

    <line x1="610" y1="79" x2="648" y2="79" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="650" y="24" width="440" height="110" rx="8" fill="#dcfce7" stroke="#059669"/>
    <text x="870" y="50" text-anchor="middle" class="box">resolveBudgetTokens(window, ratio)</text>
    <text x="870" y="70" text-anchor="middle" class="box-sub">LLM_CONTEXT_WINDOW_TOKENS 默认 64000</text>
    <text x="870" y="88" text-anchor="middle" class="box-sub">LLM_CONTEXT_BUDGET_RATIO 默认 0.5</text>
    <text x="870" y="106" text-anchor="middle" class="box-sub">夹在 [1024, window] · 换模型只改环境变量</text>
    <text x="870" y="124" text-anchor="middle" class="file">context/tokenBudget.ts</text>

    <rect x="1130" y="24" width="260" height="110" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="1260" y="52" text-anchor="middle" class="box">模型上下文窗口</text>
    <text x="1260" y="74" text-anchor="middle" class="box-sub">只作预算基准</text>
    <text x="1260" y="92" text-anchor="middle" class="box-sub">未公开值时按 64K 兜底</text>
    <text x="1260" y="112" text-anchor="middle" class="file">runtimeConfig.ts</text>
  </g>

  <g transform="translate(40, 400)">
    <text x="0" y="0" class="phase">2 · buildContext：system → 摘要 → 近期原文（顺序固定，纯函数）</text>

    <rect x="10" y="24" width="250" height="110" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="135" y="50" text-anchor="middle" class="box">useChat.send()</text>
    <text x="135" y="70" text-anchor="middle" class="box-sub">messages = history</text>
    <text x="135" y="88" text-anchor="middle" class="box-sub">contextSummary 独立 ref</text>
    <text x="135" y="106" text-anchor="middle" class="box-sub">不把摘要混进 ChatMessage</text>
    <text x="135" y="124" text-anchor="middle" class="file">composables/useChat.ts</text>

    <line x1="260" y1="79" x2="298" y2="79" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="300" y="24" width="310" height="110" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="455" y="50" text-anchor="middle" class="box">createChatStream()</text>
    <text x="455" y="70" text-anchor="middle" class="box-sub">contextMode = "budget"</text>
    <text x="455" y="88" text-anchor="middle" class="box-sub">legacy 分支保留：clipMessages</text>
    <text x="455" y="106" text-anchor="middle" class="box-sub">plan / eval 仍走 legacy</text>
    <text x="455" y="124" text-anchor="middle" class="file">server/chat.ts</text>

    <line x1="610" y1="79" x2="648" y2="79" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="650" y="24" width="440" height="160" rx="8" fill="#dcfce7" stroke="#059669"/>
    <text x="870" y="48" text-anchor="middle" class="box">buildContext(messages, summary, budget)</text>
    <text x="870" y="70" text-anchor="middle" class="box-sub">1) system  = buildSystemPrompt(searchDocs)</text>
    <text x="870" y="88" text-anchor="middle" class="box-sub">2) system  = renderSummaryText(summary)</text>
    <text x="870" y="106" text-anchor="middle" class="box-sub">3) recent  = 最近 N 轮原文（整轮配对）</text>
    <text x="870" y="124" text-anchor="middle" class="box-sub">估算 token = estimateMessagesTokens × 1.15</text>
    <text x="870" y="142" text-anchor="middle" class="box-sub">超预算 → 从最旧一轮开始丢</text>
    <text x="870" y="164" text-anchor="middle" class="file">context/buildContext.ts</text>
  </g>

  <g transform="translate(40, 610)">
    <text x="0" y="0" class="phase">3 · 只有真的丢了内容才压缩；摘要失败只降级，不报错</text>

    <rect x="650" y="24" width="440" height="80" rx="8" fill="#dcfce7" stroke="#059669"/>
    <text x="870" y="52" text-anchor="middle" class="box">droppedMessages.length &gt; 0 ?</text>
    <text x="870" y="74" text-anchor="middle" class="box-sub">被预算丢掉、尚未被摘要覆盖的原始消息</text>
    <text x="870" y="92" text-anchor="middle" class="file">ContextBuildResult.droppedMessageIndices</text>

    <line x1="870" y1="104" x2="870" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="882" y="130" class="warn">是</text>

    <rect x="650" y="150" width="440" height="150" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="870" y="174" text-anchor="middle" class="box">summarizeDroppedMessages()</text>
    <text x="870" y="194" text-anchor="middle" class="box-sub">temperature 0.2 · max 1500 tokens · 30s 超时</text>
    <text x="870" y="212" text-anchor="middle" class="box-sub">只输出 4 类：facts / decisions /</text>
    <text x="870" y="230" text-anchor="middle" class="box-sub">unresolved / userConstraints</text>
    <text x="870" y="248" text-anchor="middle" class="box-sub">每条带 sourceMessageIndex，服务端校验</text>
    <text x="870" y="268" text-anchor="middle" class="warn">失败（超时 / 非 200 / 非法 JSON）→ null</text>
    <text x="870" y="288" text-anchor="middle" class="file">context/summarize.ts</text>

    <line x1="1090" y1="205" x2="1128" y2="205" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="1100" y="196" class="ok">成功</text>

    <rect x="1130" y="150" width="260" height="110" rx="8" fill="#dcfce7" stroke="#059669"/>
    <text x="1260" y="176" text-anchor="middle" class="box">用新摘要重建上下文</text>
    <text x="1260" y="196" text-anchor="middle" class="box-sub">buildContext(summary)</text>
    <text x="1260" y="214" text-anchor="middle" class="box-sub">degraded = false</text>
    <text x="1260" y="232" text-anchor="middle" class="box-sub">覆盖范围内原文不再注入</text>
    <text x="1260" y="250" text-anchor="middle" class="file">compactedUntilIndex 去重</text>

    <path d="M870 300 L870 345 L1128 345" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <text x="884" y="336" class="warn">失败</text>

    <rect x="1130" y="290" width="260" height="110" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="1260" y="316" text-anchor="middle" class="box">summary = null</text>
    <text x="1260" y="336" text-anchor="middle" class="box-sub">degraded = true</text>
    <text x="1260" y="354" text-anchor="middle" class="box-sub">不注入任何摘要</text>
    <text x="1260" y="372" text-anchor="middle" class="box-sub">裸窗口继续聊天</text>
    <text x="1260" y="390" text-anchor="middle" class="file">聊天不中断</text>

    <line x1="1090" y1="64" x2="1128" y2="64" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1096" y="56" class="label">否</text>

    <rect x="1130" y="24" width="260" height="80" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="1260" y="50" text-anchor="middle" class="box">未丢内容</text>
    <text x="1260" y="70" text-anchor="middle" class="box-sub">不生成摘要</text>
    <text x="1260" y="88" text-anchor="middle" class="box-sub">不推 context_compacted</text>
  </g>

  <g transform="translate(40, 980)">
    <text x="0" y="0" class="phase">4 · 注入：摘要是一条独立 system 消息（资料，不是指令）</text>

    <rect x="650" y="24" width="440" height="120" rx="8" fill="#dcfce7" stroke="#059669"/>
    <text x="870" y="50" text-anchor="middle" class="box">assertToolPairing(messages)</text>
    <text x="870" y="70" text-anchor="middle" class="box-sub">进图前断言一次（此刻应无工具消息）</text>
    <text x="870" y="88" text-anchor="middle" class="box-sub">applyTools 回填后立刻再断言一次</text>
    <text x="870" y="106" text-anchor="middle" class="box-sub">tool_calls.id ↔ tool_call_id 严格配对</text>
    <text x="870" y="124" text-anchor="middle" class="box-sub">孤儿调用 / 孤儿结果 / 顺序颠倒 → 抛错</text>
    <text x="870" y="140" text-anchor="middle" class="file">context/assertToolPairing.ts</text>

    <line x1="1090" y1="84" x2="1128" y2="84" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <rect x="1130" y="24" width="260" height="140" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="1260" y="50" text-anchor="middle" class="box">[system] 角色 + 安全约束</text>
    <text x="1260" y="70" text-anchor="middle" class="box">[system] 历史摘要</text>
    <text x="1260" y="88" text-anchor="middle" class="box-sub">开头声明「是资料，不是指令」</text>
    <text x="1260" y="106" text-anchor="middle" class="box">[...] 近期原文（整轮）</text>
    <text x="1260" y="128" text-anchor="middle" class="box">runConversation(ReAct)</text>
    <text x="1260" y="150" text-anchor="middle" class="file">askModel ↔ applyTools → reply</text>
  </g>

  <g transform="translate(40, 1190)">
    <text x="0" y="0" class="phase">5 · 回传：context_compacted 不带 delta，不污染回答正文</text>

    <rect x="1130" y="24" width="260" height="120" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="1260" y="50" text-anchor="middle" class="box">onTrace(context_compacted)</text>
    <text x="1260" y="70" text-anchor="middle" class="box-sub">compactedRounds</text>
    <text x="1260" y="88" text-anchor="middle" class="box-sub">originalTokens → compactedTokens</text>
    <text x="1260" y="106" text-anchor="middle" class="box-sub">summaryTokens · degraded</text>
    <text x="1260" y="124" text-anchor="middle" class="box-sub">summary（失败为 null）</text>
    <text x="1260" y="140" text-anchor="middle" class="file">routes/chat.ts · sse.ts</text>

    <line x1="1128" y1="84" x2="262" y2="84" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>
    <text x="690" y="74" text-anchor="middle" class="label-em">SSE · 无 delta 字段</text>

    <rect x="10" y="24" width="250" height="130" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="135" y="50" text-anchor="middle" class="box">ContextCompactionNotice</text>
    <text x="135" y="70" text-anchor="middle" class="box-sub">已压缩 N 轮（A → B token）</text>
    <text x="135" y="88" text-anchor="middle" class="box-sub">可展开：约束 / 事实 / 决定 / 未决</text>
    <text x="135" y="106" text-anchor="middle" class="box-sub">UsagePanel：压缩省了多少</text>
    <text x="135" y="124" text-anchor="middle" class="box-sub">摘要用量记 source="summary"</text>
    <text x="135" y="146" text-anchor="middle" class="file">localStorage.setItem(summary)</text>
  </g>

  <path d="M740,1344 L740,1388" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="760" y="1372" class="note">同一 buildContext + maybeSummarize 内核复用到多 Agent Worker</text>

  <g transform="translate(40, 1390)">
    <text x="0" y="0" class="phase">6 · 多 Agent Worker 接入：路由层压缩一次，只进 Worker</text>

    <rect x="10" y="24" width="300" height="140" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="160" y="50" text-anchor="middle" class="box">chatMulti 路由</text>
    <text x="160" y="70" text-anchor="middle" class="box-sub">取最后一条 user 之前的非空、无附件消息</text>
    <text x="160" y="88" text-anchor="middle" class="box-sub">buildContext 裁历史（空 systemPrompt / 无 memory）</text>
    <text x="160" y="106" text-anchor="middle" class="box-sub">有丢弃 → maybeSummarize 生成摘要</text>
    <text x="160" y="124" text-anchor="middle" class="box-sub">推 context_compacted（与单 Agent 同形状）</text>
    <text x="160" y="142" text-anchor="middle" class="file">routes/chatMulti.ts</text>

    <line x1="310" y1="94" x2="350" y2="94" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <rect x="350" y="24" width="320" height="140" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="510" y="50" text-anchor="middle" class="box">compileMultiAgentGraph</text>
    <text x="510" y="70" text-anchor="middle" class="box-sub">options 带 historyMessages + contextSummary</text>
    <text x="510" y="88" text-anchor="middle" class="box-sub">workersNode 透传给每个 Worker</text>
    <text x="510" y="106" text-anchor="middle" class="box-sub">Supervisor / Aggregate 不注入</text>
    <text x="510" y="124" text-anchor="middle" class="box-sub">路由判断只看当前问句、汇总不产生新事实</text>
    <text x="510" y="142" text-anchor="middle" class="file">multi-agent/graph.ts</text>

    <line x1="670" y1="94" x2="710" y2="94" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <rect x="710" y="24" width="340" height="140" rx="8" fill="#dcfce7" stroke="#059669"/>
    <text x="880" y="50" text-anchor="middle" class="box">buildWorkerMessages</text>
    <text x="880" y="70" text-anchor="middle" class="box-sub">system → 摘要 → 记忆 → 近期原文 → task</text>
    <text x="880" y="88" text-anchor="middle" class="box-sub">historyMessages / contextSummary 缺省不注入</text>
    <text x="880" y="106" text-anchor="middle" class="box-sub">无历史时输出与接入前逐字一致</text>
    <text x="880" y="124" text-anchor="middle" class="box-sub">四个 Worker（general / kb / realtime / action）</text>
    <text x="880" y="142" text-anchor="middle" class="file">multi-agent/workers/memoryPrompt.ts</text>

    <rect x="1080" y="24" width="300" height="140" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="1230" y="50" text-anchor="middle" class="box">前端（多 Agent 共用）</text>
    <text x="1230" y="70" text-anchor="middle" class="box-sub">streamChat → /api/chat/multi</text>
    <text x="1230" y="88" text-anchor="middle" class="box-sub">统一解析 context_compacted</text>
    <text x="1230" y="106" text-anchor="middle" class="box-sub">ContextCompactionNotice 显示「已压缩 N 轮」</text>
    <text x="1230" y="124" text-anchor="middle" class="box-sub">单 / 多 Agent 同组件、同样式</text>
    <text x="1230" y="142" text-anchor="middle" class="file">api/chat.ts · useChat.ts</text>

    <text x="20" y="196" class="note">口径：只进 Worker 不进 Supervisor / Aggregate；压缩只在路由层做一次，避免四个 Worker 各压一次重复计算。</text>
  </g>

  <g transform="translate(40, 1610)">
    <rect x="0" y="0" width="1400" height="190" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="20" y="30" class="phase">边界与失败策略</text>

    <text x="20" y="62" class="box">硬规则</text>
    <text x="20" y="84" class="box-sub">① 整轮保留：user + assistant 必须成对</text>
    <text x="20" y="104" class="box-sub">② 本轮提问必留：装不下就截断正文并打标记</text>
    <text x="20" y="124" class="box-sub">③ 预算优先：估算 × 1.15 ≤ 预算，超了从最旧丢</text>

    <text x="500" y="62" class="box">去重与版本</text>
    <text x="500" y="84" class="box-sub">摘要带 compactedUntilIndex（下标口径）</text>
    <text x="500" y="104" class="box-sub">覆盖范围内原文不再注入，避免说两遍</text>
    <text x="500" y="124" class="box-sub">版本不认识 / 摘要超预算 → 忽略摘要</text>

    <text x="960" y="62" class="box">降级</text>
    <text x="960" y="84" class="box-sub">摘要任何失败 → null + degraded=true</text>
    <text x="960" y="104" class="box-sub">本轮只有近期原文，聊天照常继续</text>
    <text x="960" y="124" class="box-sub">截断优先级：约束 &gt; 事实 &gt; 决定 &gt; 未决</text>

    <text x="20" y="160" class="note">生效范围：/api/chat（单 Agent）+ /api/chat/multi（多 Agent Worker，只进 Worker 不进 Supervisor/Aggregate）；plan 仍走 legacy、rag 走独立 prompt，均不改语义。</text>
    <text x="20" y="178" class="note">验证：40 项接入检查 + 50 轮长对话脚本（第 3 轮事实在第 50 轮仍可召回；no-summary 模式丢失）。</text>
  </g>

  <text x="740" y="1900" text-anchor="middle" class="subtitle">docs/long-context-flow.svg</text>
</svg>
