<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1950" width="1480" height="1950" role="img" aria-label="Dynamic Tool Discovery Flow">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px sans-serif; fill: #64748b; }
      .lane { font: 700 12px sans-serif; fill: #475569; }
      .phase { font: 700 14px sans-serif; fill: #1e293b; }
      .box { font: 600 12px monospace; fill: #0f172a; }
      .box-sub { font: 400 11px sans-serif; fill: #64748b; }
      .file { font: 400 10px monospace; fill: #94a3b8; }
      .label { font: 500 11px sans-serif; fill: #475569; }
      .label-em { font: 600 11px sans-serif; fill: #2563eb; }
      .note { font: 400 11px sans-serif; fill: #64748b; }
      .legend { font: 500 11px sans-serif; fill: #334155; }
      .warn { font: 600 11px sans-serif; fill: #b45309; }
    ]]></style>
  </defs>
  <rect width="1480" height="1950" fill="#f8fafc"/>

  <text x="40" y="42" class="title">工具注册：现状 vs 动态发现（目标）</text>
  <text x="40" y="66" class="subtitle">当前仓库仍是静态 toolList；下图对照「手改多处」与「启动扫描 modules」两条路径</text>

  <g transform="translate(40, 100)">
    <text x="0" y="0" class="phase">现状：静态注册（现网）</text>
<rect x="20" y="24" width="280" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
<text x="160.0" y="46" text-anchor="middle" class="box">schemas/xxx.ts</text>
<text x="160.0" y="64" text-anchor="middle" class="box-sub">ToolSchema 给模型</text><line x1="300" y1="59" x2="340" y2="59" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340" y="24" width="280" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
<text x="480.0" y="46" text-anchor="middle" class="box">methods/xxx.ts</text>
<text x="480.0" y="64" text-anchor="middle" class="box-sub">run(rawArguments)</text><line x1="620" y1="59" x2="660" y2="59" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="660" y="24" width="320" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="820.0" y="46" text-anchor="middle" class="box">tools/index.ts toolList</text>
<text x="820.0" y="64" text-anchor="middle" class="box-sub">手工 import + 粘合</text><line x1="820" y1="94" x2="820" y2="140" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/><rect x="660" y="140" width="320" height="100" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="820.0" y="162" text-anchor="middle" class="box">还要手改：</text>
<text x="820.0" y="180" text-anchor="middle" class="box-sub">toolCallGuard ALLOWED_TOOLS</text>
<text x="820.0" y="198" text-anchor="middle" class="box-sub">mcp/createServer registerTool</text>
<text x="820.0" y="216" text-anchor="middle" class="box-sub">Worker 硬编码名字列表</text><line x1="980" y1="59" x2="1020" y2="59" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1020" y="24" width="400" height="86" rx="8" fill="#d1fae5" stroke="#059669"/>
<text x="1220.0" y="46" text-anchor="middle" class="box">运行时调用</text>
<text x="1220.0" y="64" text-anchor="middle" class="box-sub">findTool(name) → tool.run</text>
<text x="1220.0" y="82" text-anchor="middle" class="box-sub">或 runToolSafely / MCP</text>
<text x="1220.0" y="100" text-anchor="middle" class="file">tools/index.ts</text>
  </g>

  <g transform="translate(40, 420)">
    <text x="0" y="0" class="phase">调用链（模型 → 执行）</text>
<rect x="20" y="24" width="300" height="62" rx="8" fill="#fce7f3" stroke="#db2777"/>
<text x="170.0" y="46" text-anchor="middle" class="box">LLM tool_calls[].name</text>
<text x="170.0" y="64" text-anchor="middle" class="box-sub">arguments JSON 字符串</text><line x1="320" y1="55" x2="360" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="360" y="24" width="300" height="62" rx="8" fill="#d1fae5" stroke="#059669"/>
<text x="510.0" y="46" text-anchor="middle" class="box">validateToolCall</text>
<text x="510.0" y="64" text-anchor="middle" class="box-sub">白名单 / 长度 / JSON</text><line x1="660" y1="55" x2="700" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="700" y="24" width="300" height="62" rx="8" fill="#d1fae5" stroke="#059669"/>
<text x="850.0" y="46" text-anchor="middle" class="box">findTool / runToolCall</text>
<text x="850.0" y="64" text-anchor="middle" class="box-sub">runToolWithTracing</text><line x1="1000" y1="55" x2="1040" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1040" y="24" width="380" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="1230.0" y="46" text-anchor="middle" class="box">需确认? → wait/resolve</text>
<text x="1230.0" y="64" text-anchor="middle" class="box-sub">否则立刻 run</text>
  </g>

  <g transform="translate(40, 580)">
    <text x="0" y="0" class="phase">目标：discoverTools() 启动扫描（学习文档，未落地）</text>
<rect x="20" y="24" width="360" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="200.0" y="46" text-anchor="middle" class="box">modules/getWeather/</text>
<text x="200.0" y="64" text-anchor="middle" class="box-sub">schema.ts + run.ts + meta.ts</text>
<text x="200.0" y="82" text-anchor="middle" class="box-sub">约定导出 name/schema/run</text>
<text x="200.0" y="100" text-anchor="middle" class="file">dynamic-tool-discovery.md</text><line x1="380" y1="74" x2="420" y2="74" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/><rect x="420" y="24" width="400" height="100" rx="8" fill="#d1fae5" stroke="#059669"/>
<text x="620.0" y="46" text-anchor="middle" class="box">discoverTools()</text>
<text x="620.0" y="64" text-anchor="middle" class="box-sub">扫 modules/* 校验齐全</text>
<text x="620.0" y="82" text-anchor="middle" class="box-sub">→ ToolDefinition[]</text><line x1="820" y1="74" x2="860" y2="74" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/><rect x="860" y="24" width="560" height="120" rx="8" fill="#ecfdf5" stroke="#059669"/>
<text x="1140.0" y="46" text-anchor="middle" class="box">一次派生多份清单</text>
<text x="1140.0" y="64" text-anchor="middle" class="box-sub">toolByName Map</text>
<text x="1140.0" y="82" text-anchor="middle" class="box-sub">ALLOWED_TOOLS（Guard）</text>
<text x="1140.0" y="100" text-anchor="middle" class="box-sub">toolSchemasForChat(filter)</text>
<text x="1140.0" y="118" text-anchor="middle" class="box-sub">MCP register 循环</text>
  </g>

  <g transform="translate(40, 820)">
    <text x="0" y="0" class="phase">加新工具：改动面对比</text>
    <rect x="20" y="20" width="680" height="200" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="40" y="52" class="box">现状最少改 4~6 处</text>
    <text x="40" y="80" class="box-sub">1 schemas  2 methods  3 index toolList</text>
    <text x="40" y="108" class="box-sub">4 ALLOWED_TOOLS  5 MCP register</text>
    <text x="40" y="136" class="box-sub">6（可选）Worker 名字列表</text>
    <text x="40" y="172" class="warn">漏改 → 模型能选但 Guard 拒 / MCP 无</text>

    <rect x="740" y="20" width="680" height="200" rx="10" fill="#ecfdf5" stroke="#059669"/>
    <text x="760" y="52" class="box">目标：只新建 module 目录</text>
    <text x="760" y="80" class="box-sub">启动自动进 Map / Guard / MCP</text>
    <text x="760" y="108" class="box-sub">Worker 可见集仍建议显式（安全边界）</text>
    <text x="760" y="136" class="box-sub">需确认工具：meta.requiresConfirm</text>
    <text x="760" y="172" class="label-em">文档：docs/dynamic-tool-discovery.md</text>
  </g>

  <g transform="translate(40, 1100)">
    <rect x="20" y="0" width="1400" height="100" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="40" y="32" class="phase">方法调用链（现网）</text>
    <text x="40" y="58" class="box">askModel → tool_calls → applyToolCalls → validateToolCall → findTool → run / ConfirmSession.wait → tool message → askModel</text>
    <text x="40" y="80" class="box">multi: Worker → runToolSafely → findTool → run</text>
  </g>

  <text x="740" y="1925" text-anchor="middle" class="subtitle">docs/dynamic-tool-discovery-flow.svg</text>
</svg>
