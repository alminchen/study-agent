<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1680" width="1480" height="1680" role="img" aria-label="Dynamic Tool Discovery Flow">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px sans-serif; fill: #64748b; }
      .lane { font: 700 12px sans-serif; fill: #475569; }
      .phase { font: 700 14px sans-serif; fill: #1e293b; }
      .box { font: 600 12px monospace; fill: #0f172a; }
      .box-sub { font: 400 11px sans-serif; fill: #64748b; }
      .file { font: 400 10px monospace; fill: #94a3b8; }
      .label { font: 500 11px sans-serif; fill: #475569; }
      .label-em { font: 600 11px sans-serif; fill: #2563eb; }
      .note { font: 400 11px sans-serif; fill: #64748b; }
      .legend { font: 500 11px sans-serif; fill: #334155; }
      .warn { font: 600 11px sans-serif; fill: #b45309; }
      .card-t { font: 700 13px sans-serif; fill: #0f172a; }
    ]]></style>
  </defs>
  <rect width="1480" height="1680" fill="#f8fafc"/>

  <text x="40" y="42" class="title">工具注册：动态发现（阶段 5 已落地）</text>
  <text x="40" y="66" class="subtitle">启动扫描 server/tools/modules/* → discoverTools() 启动期校验 → createRegistry() 派生唯一清单 → Guard / MCP / Chat / Worker 四路消费</text>

  <g transform="translate(40, 100)">
    <text x="0" y="0" class="phase">① 启动期：固定目录扫描 + 启动校验</text>
<rect x="20" y="24" width="270" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="155.0" y="44" text-anchor="middle" class="box">modules/getWeather/</text>
<text x="155.0" y="62" text-anchor="middle" class="box-sub">tags realtime · risk read · MCP</text><rect x="20" y="92" width="270" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="155.0" y="112" text-anchor="middle" class="box">modules/getCurrentTime/</text>
<text x="155.0" y="130" text-anchor="middle" class="box-sub">tags realtime · risk read · MCP</text><rect x="20" y="160" width="270" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="155.0" y="180" text-anchor="middle" class="box">modules/searchDocs/</text>
<text x="155.0" y="198" text-anchor="middle" class="box-sub">tags kb · risk read · MCP</text><rect x="20" y="228" width="270" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
<text x="155.0" y="248" text-anchor="middle" class="box">modules/draft_message/</text>
<text x="155.0" y="266" text-anchor="middle" class="box-sub">tags action · risk confirm · 不进 MCP</text><line x1="290" y1="52" x2="310" y2="52" stroke="#334155" stroke-width="1.5"/>
<line x1="290" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1.5"/>
<line x1="290" y1="188" x2="310" y2="188" stroke="#334155" stroke-width="1.5"/>
<line x1="290" y1="256" x2="310" y2="256" stroke="#334155" stroke-width="1.5"/>
<line x1="310" y1="52" x2="310" y2="256" stroke="#334155" stroke-width="1.5"/>
<line x1="310" y1="154" x2="336" y2="154" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340" y="24" width="320" height="140" rx="8" fill="#d1fae5" stroke="#059669"/>
<text x="500.0" y="48" text-anchor="middle" class="box">discoverTools()</text>
<text x="500.0" y="70" text-anchor="middle" class="box-sub">扫 modules/* 一级目录（根目录固定）</text>
<text x="500.0" y="88" text-anchor="middle" class="box-sub">目录名 localeCompare → 顺序稳定</text>
<text x="500.0" y="106" text-anchor="middle" class="box-sub">动态 import() + 结构校验</text>
<text x="500.0" y="128" text-anchor="middle" class="file">tools/discover.ts</text><line x1="660" y1="94" x2="696" y2="94" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/><rect x="700" y="24" width="320" height="140" rx="8" fill="#d1fae5" stroke="#059669"/>
<text x="860.0" y="48" text-anchor="middle" class="box">createRegistry(tools)</text>
<text x="860.0" y="70" text-anchor="middle" class="box-sub">重名即抛错（启动期失败）</text>
<text x="860.0" y="88" text-anchor="middle" class="box-sub">toolByName Map</text>
<text x="860.0" y="106" text-anchor="middle" class="box-sub">派生全部对外清单</text>
<text x="860.0" y="128" text-anchor="middle" class="file">tools/registry.ts</text><line x1="1020" y1="94" x2="1056" y2="94" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/><rect x="1060" y="24" width="360" height="140" rx="8" fill="#ecfdf5" stroke="#059669"/>
<text x="1240.0" y="48" text-anchor="middle" class="box">唯一注册表 registry</text>
<text x="1240.0" y="70" text-anchor="middle" class="box-sub">4 个工具 · 字母序</text>
<text x="1240.0" y="88" text-anchor="middle" class="box-sub">draft_message · getCurrentTime</text>
<text x="1240.0" y="106" text-anchor="middle" class="box-sub">getWeather · searchDocs</text>
<text x="1240.0" y="128" text-anchor="middle" class="file">tools/index.ts（对外 re-export，API 不变）</text><rect x="340" y="182" width="680" height="58" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="680.0" y="206" text-anchor="middle" class="box">校验失败 → 启动直接抛错，不静默跳过</text>
<text x="680.0" y="226" text-anchor="middle" class="box-sub">缺 run / 重名 / name ≠ schema.function.name / 非法 risk 或 tag</text>
  </g>

  <g transform="translate(40, 380)">
    <text x="0" y="0" class="phase">② createRegistry() 派生：一份清单，多处消费</text>
<rect x="20" y="24" width="1340" height="48" rx="8" fill="#ecfdf5" stroke="#059669"/>
<text x="690.0" y="44" text-anchor="middle" class="box">registry —— 唯一注册表（tools/registry.ts）</text>
<text x="690.0" y="62" text-anchor="middle" class="box-sub">对外 API 保持不变，上层（react / multi-agent / mcp）无需改调用方式</text><line x1="690" y1="72" x2="690" y2="96" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="10" y1="100" x2="1200" y2="100" stroke="#059669" stroke-width="1.5"/>
<line x1="10" y1="100" x2="10" y2="194" stroke="#059669" stroke-width="1.5"/>
<line x1="10" y1="194" x2="1200" y2="194" stroke="#059669" stroke-width="1.5"/>
<line x1="180" y1="100" x2="180" y2="112" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="520" y1="100" x2="520" y2="112" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="860" y1="100" x2="860" y2="112" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="1200" y1="100" x2="1200" y2="112" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="180" y1="194" x2="180" y2="206" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="520" y1="194" x2="520" y2="206" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="860" y1="194" x2="860" y2="206" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="1200" y1="194" x2="1200" y2="206" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/><rect x="20" y="116" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="180.0" y="140" text-anchor="middle" class="box">findTool(name)</text>
<text x="180.0" y="160" text-anchor="middle" class="box-sub">Map 查找（唯一入口）</text><rect x="360" y="116" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="520.0" y="140" text-anchor="middle" class="box">listTools() / listToolNames()</text>
<text x="520.0" y="160" text-anchor="middle" class="box-sub">全量工具与工具名（Guard 用）</text><rect x="700" y="116" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="860.0" y="140" text-anchor="middle" class="box">toolSchemas</text>
<text x="860.0" y="160" text-anchor="middle" class="box-sub">全部工具的模型端 schema</text><rect x="1040" y="116" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="1200.0" y="140" text-anchor="middle" class="box">toolSchemasForChat(kb, confirm)</text>
<text x="1200.0" y="160" text-anchor="middle" class="box-sub">按知识库开关 / 确认开关过滤</text><rect x="20" y="210" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="180.0" y="234" text-anchor="middle" class="box">toolsWithTags(tags)</text>
<text x="180.0" y="254" text-anchor="middle" class="box-sub">Worker 可见集（按 tag）</text><rect x="360" y="210" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="520.0" y="234" text-anchor="middle" class="box">toolsWithMcp()</text>
<text x="520.0" y="254" text-anchor="middle" class="box-sub">MCP 注册集</text><rect x="700" y="210" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="860.0" y="234" text-anchor="middle" class="box">isToolRequiringConfirm(name)</text>
<text x="860.0" y="254" text-anchor="middle" class="box-sub">risk === "confirm" 判定</text><rect x="1040" y="210" width="320" height="68" rx="8" fill="#ffffff" stroke="#059669"/>
<text x="1200.0" y="234" text-anchor="middle" class="box">toolList</text>
<text x="1200.0" y="254" text-anchor="middle" class="box-sub">兼容旧调用的全量数组</text>
  </g>

  <g transform="translate(40, 700)">
    <text x="0" y="0" class="phase">③ 四路消费方：都读注册表，不再手抄工具名</text>
<rect x="20" y="24" width="330" height="170" rx="10" fill="#ffffff" stroke="#dc2626"/>
<text x="185.0" y="52" text-anchor="middle" class="card-t">Guard 白名单</text>
<text x="185.0" y="72" text-anchor="middle" class="file">guard/toolCallGuard.ts</text>
<text x="185.0" y="100" text-anchor="middle" class="box-sub">validateToolCall → listToolNames()</text>
<text x="185.0" y="122" text-anchor="middle" class="box-sub">已无手抄 ALLOWED_TOOLS</text>
<text x="185.0" y="144" text-anchor="middle" class="box-sub">名单变了自动跟随</text>
<text x="185.0" y="172" text-anchor="middle" class="label-em">仍是白名单，只是不同源</text><rect x="370" y="24" width="330" height="170" rx="10" fill="#ffffff" stroke="#7c3aed"/>
<text x="535.0" y="52" text-anchor="middle" class="card-t">MCP 注册</text>
<text x="535.0" y="72" text-anchor="middle" class="file">mcp/createServer.ts</text>
<text x="535.0" y="100" text-anchor="middle" class="box-sub">for (const t of toolsWithMcp())</text>
<text x="535.0" y="122" text-anchor="middle" class="box-sub">registerTool(t.name, …)</text>
<text x="535.0" y="144" text-anchor="middle" class="box-sub">inputSchema 取 mcp.inputSchema</text>
<text x="535.0" y="172" text-anchor="middle" class="label-em">draft_message 不进 MCP</text><rect x="720" y="24" width="330" height="170" rx="10" fill="#ffffff" stroke="#2563eb"/>
<text x="885.0" y="52" text-anchor="middle" class="card-t">Chat schema</text>
<text x="885.0" y="72" text-anchor="middle" class="file">react/requestCompletion.ts</text>
<text x="885.0" y="100" text-anchor="middle" class="box-sub">toolSchemasForChat(kb, confirm)</text>
<text x="885.0" y="122" text-anchor="middle" class="box-sub">searchDocs 受知识库开关</text>
<text x="885.0" y="144" text-anchor="middle" class="box-sub">draft_message 受 ConfirmSession</text>
<text x="885.0" y="172" text-anchor="middle" class="label-em">语义 C 保持不变</text><rect x="1070" y="24" width="330" height="170" rx="10" fill="#ffffff" stroke="#059669"/>
<text x="1235.0" y="52" text-anchor="middle" class="card-t">Worker 可见集</text>
<text x="1235.0" y="72" text-anchor="middle" class="file">multi-agent/workers/*.ts</text>
<text x="1235.0" y="100" text-anchor="middle" class="box-sub">toolsWithTags(["realtime"])</text>
<text x="1235.0" y="122" text-anchor="middle" class="box-sub">kbWorker → ["kb"]</text>
<text x="1235.0" y="144" text-anchor="middle" class="box-sub">actionWorker → ["action"]</text>
<text x="1235.0" y="172" text-anchor="middle" class="label-em">隔离仍是显式策略</text>
  </g>

  <g transform="translate(40, 940)">
    <text x="0" y="0" class="phase">④ 调用链（改造前后完全一致）</text>
<rect x="20" y="24" width="260" height="62" rx="8" fill="#fce7f3" stroke="#db2777"/>
<text x="150.0" y="46" text-anchor="middle" class="box">LLM tool_calls[].name</text>
<text x="150.0" y="64" text-anchor="middle" class="box-sub">arguments JSON 字符串</text><line x1="280" y1="55" x2="301" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="305" y="24" width="260" height="62" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="435.0" y="46" text-anchor="middle" class="box">validateToolCall</text>
<text x="435.0" y="64" text-anchor="middle" class="box-sub">白名单 / 长度 / JSON</text><line x1="565" y1="55" x2="586" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="590" y="24" width="260" height="62" rx="8" fill="#d1fae5" stroke="#059669"/>
<text x="720.0" y="46" text-anchor="middle" class="box">findTool / runToolCall</text>
<text x="720.0" y="64" text-anchor="middle" class="box-sub">runToolWithTracing</text><line x1="850" y1="55" x2="871" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="875" y="24" width="260" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="1005.0" y="46" text-anchor="middle" class="box">isToolRequiringConfirm?</text>
<text x="1005.0" y="64" text-anchor="middle" class="box-sub">risk === "confirm"</text><line x1="1135" y1="55" x2="1156" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1160" y="24" width="260" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="1290.0" y="46" text-anchor="middle" class="box">需确认? → wait/resolve</text>
<text x="1290.0" y="64" text-anchor="middle" class="box-sub">否则立刻 run</text><rect x="20" y="100" width="1400" height="58" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="40" y="126" class="box">单 Agent：askModel → tool_calls → applyToolCalls → validateToolCall → findTool → run / ConfirmSession.wait → tool message → askModel</text>
<text x="40" y="146" class="box">多 Agent：Worker → runToolSafely → findTool → run</text>
  </g>

  <g transform="translate(40, 1130)">
    <text x="0" y="0" class="phase">⑤ 改造前 vs 改造后</text>
    <rect x="20" y="20" width="680" height="200" rx="10" fill="#fff7ed" stroke="#d97706"/>
<text x="40" y="52" class="box">改造前：静态注册表</text>
<text x="40" y="80" class="box-sub">1 schemas  2 methods  3 index toolList</text>
<text x="40" y="108" class="box-sub">4 Guard ALLOWED_TOOLS  5 MCP register</text>
<text x="40" y="136" class="box-sub">6（可选）Worker 名字列表</text>
<text x="40" y="172" class="warn">漏改 → 模型能选但 Guard 拒 / MCP 无</text>
<text x="40" y="198" class="note">工具名散落多处，改名 / 删工具要同步 6 处</text>

    <rect x="740" y="20" width="680" height="200" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="760" y="52" class="box">改造后：动态发现（已落地）</text>
<text x="760" y="80" class="box-sub">只新建 module 目录</text>
<text x="760" y="108" class="box-sub">启动自动进 registry / Guard / MCP / Chat</text>
<text x="760" y="136" class="box-sub">Worker 可见集仍显式（tag 策略）</text>
<text x="760" y="172" class="label-em">需确认工具：模块声明 risk: "confirm"</text>
<text x="760" y="198" class="note">文档：docs/dynamic-tool-discovery.md</text>
  </g>

  <g transform="translate(40, 1390)">
    <text x="0" y="0" class="phase">⑥ 现在加一个新工具，要改几处？</text>
    <rect x="20" y="20" width="440" height="140" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="240.0" y="56" text-anchor="middle" class="card-t">1 处</text>
<text x="240.0" y="84" text-anchor="middle" class="box-sub">新建 modules/&lt;name&gt;/index.ts</text>
<text x="240.0" y="106" text-anchor="middle" class="box-sub">声明 name / schema / run /</text>
<text x="240.0" y="128" text-anchor="middle" class="box-sub">tags / risk / mcp</text>
    <rect x="500" y="20" width="440" height="140" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="720.0" y="56" text-anchor="middle" class="card-t">0 处</text>
<text x="720.0" y="84" text-anchor="middle" class="box-sub">tools/index.ts</text>
<text x="720.0" y="106" text-anchor="middle" class="box-sub">guard/toolCallGuard.ts</text>
<text x="720.0" y="128" text-anchor="middle" class="box-sub">mcp/createServer.ts</text>
    <rect x="980" y="20" width="440" height="140" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="1200.0" y="56" text-anchor="middle" class="card-t">仍需显式声明</text>
<text x="1200.0" y="84" text-anchor="middle" class="box-sub">tags → 决定哪些 Worker 可见</text>
<text x="1200.0" y="106" text-anchor="middle" class="box-sub">risk → 是否需要人工确认</text>
<text x="1200.0" y="128" text-anchor="middle" class="box-sub">mcp.expose → 是否挂到 MCP</text>
  </g>

  <text x="40" y="1600" class="legend">读法：① 启动扫目录并校验 → ② 派生唯一清单 → ③ 四路消费方各取所需 → ④ 调用链不变 → ⑤⑥ 加工具的改动面收敛到 1 个目录。</text>
  <text x="740" y="1640" text-anchor="middle" class="subtitle">docs/dynamic-tool-discovery-flow.svg</text>
</svg>
